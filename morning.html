<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早安圖產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #F0D98A;
    --gold-dim: #8B6E2E;
    --cream: #FDF6E3;
    --cream-dark: #F5E6C0;
    --ink: #2C1F0E;
    --ink-light: #5A4128;
    --red: #C0392B;
    --sky: #E8F4F8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(201,168,76,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(201,168,76,0.08) 0%, transparent 50%);
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    position: relative;
  }
  header::after {
    content: '';
    display: block;
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 1rem auto 0;
  }
  .header-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.1em;
  }
  header p {
    font-size: 0.8rem;
    color: var(--ink-light);
    margin-top: 0.25rem;
    letter-spacing: 0.05em;
  }

  /* ── Main layout ── */
  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 1rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* ── Card ── */
  .card {
    background: #fff;
    border: 1px solid var(--cream-dark);
    border-radius: 16px;
    padding: 1.25rem;
    box-shadow: 0 2px 12px rgba(44,31,14,0.06);
  }
  .card-title {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 0.9rem;
  }

  /* ── API Key section ── */
  .api-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .api-row input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--cream-dark);
    border-radius: 10px;
    font-size: 0.85rem;
    font-family: monospace;
    background: var(--cream);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .api-row input:focus { border-color: var(--gold); }
  .btn-save {
    padding: 0.6rem 1rem;
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 0.8rem;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .btn-save:hover { background: var(--gold-dim); }
  .api-status {
    font-size: 0.75rem;
    margin-top: 0.5rem;
    color: var(--ink-light);
  }
  .api-status.ok { color: #27ae60; }

  /* ── Style selector ── */
  .style-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .style-btn {
    padding: 0.65rem 0.5rem;
    border: 1.5px solid var(--cream-dark);
    border-radius: 12px;
    background: var(--cream);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.8rem;
    color: var(--ink-light);
    text-align: center;
    transition: all 0.18s;
  }
  .style-btn:hover { border-color: var(--gold-light); }
  .style-btn.active {
    border-color: var(--gold);
    background: #FFF8E7;
    color: var(--ink);
    font-weight: 500;
  }
  .style-btn .emoji { font-size: 1.1rem; display: block; margin-bottom: 2px; }

  /* ── Generate button ── */
  .btn-generate {
    width: 100%;
    padding: 1rem;
    background: var(--ink);
    color: var(--gold-light);
    border: none;
    border-radius: 14px;
    font-family: 'Noto Serif TC', serif;
    font-size: 1rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }
  .btn-generate:hover { background: var(--ink-light); transform: translateY(-1px); }
  .btn-generate:active { transform: translateY(0); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-generate .loading-dots { display: none; }
  .btn-generate.loading .btn-text { display: none; }
  .btn-generate.loading .loading-dots { display: inline; }

  /* ── Preview canvas ── */
  .preview-wrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(44,31,14,0.12);
    display: none;
  }
  .preview-wrap.visible { display: block; }
  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ── Download button ── */
  .btn-download {
    width: 100%;
    padding: 0.85rem;
    background: #fff;
    color: var(--ink);
    border: 1.5px solid var(--cream-dark);
    border-radius: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.18s;
  }
  .btn-download:hover { border-color: var(--gold); color: var(--gold-dim); }
  .btn-download.visible { display: flex; }

  /* ── Error message ── */
  .error-msg {
    font-size: 0.8rem;
    color: var(--red);
    padding: 0.6rem 0.8rem;
    background: #FFF0EE;
    border-radius: 10px;
    display: none;
  }
  .error-msg.visible { display: block; }

  /* ── Tip ── */
  .tip {
    font-size: 0.72rem;
    color: var(--ink-light);
    text-align: center;
    line-height: 1.7;
    opacity: 0.7;
  }
  .tip a { color: var(--gold-dim); }
</style>
</head>
<body>

<header>
  <div class="header-icon">☀️</div>
  <h1>早安圖產生器</h1>
  <p>每天一張，傳遞溫暖</p>
</header>

<main>

  <!-- API Key -->
  <div class="card">
    <div class="card-title">Gemini API 金鑰</div>
    <div class="api-row">
      <input type="password" id="apiKeyInput" placeholder="貼上你的 API Key…" autocomplete="off">
      <button class="btn-save" onclick="saveKey()">儲存</button>
    </div>
    <div class="api-status" id="apiStatus">尚未設定</div>
  </div>

  <!-- Style -->
  <div class="card">
    <div class="card-title">選擇風格</div>
    <div class="style-grid">
      <button class="style-btn active" data-style="溫馨" onclick="selectStyle(this)">
        <span class="emoji">🌸</span>溫馨感恩
      </button>
      <button class="style-btn" data-style="活力" onclick="selectStyle(this)">
        <span class="emoji">⚡</span>活力元氣
      </button>
      <button class="style-btn" data-style="禪意" onclick="selectStyle(this)">
        <span class="emoji">🍃</span>淡雅禪意
      </button>
      <button class="style-btn" data-style="幽默" onclick="selectStyle(this)">
        <span class="emoji">😄</span>輕鬆幽默
      </button>
    </div>
  </div>

  <!-- Generate -->
  <button class="btn-generate" id="generateBtn" onclick="generate()">
    <span class="btn-text">✨ 產生今日早安圖</span>
    <span class="loading-dots">生成中，請稍候…</span>
  </button>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Preview -->
  <div class="preview-wrap" id="previewWrap">
    <canvas id="canvas" width="1080" height="1080"></canvas>
  </div>

  <!-- Download -->
  <button class="btn-download" id="downloadBtn" onclick="download()">
    ⬇ 儲存圖片
  </button>

  <p class="tip">
    取得免費 API Key：<a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a><br>
    API Key 只存在你的裝置，不會上傳到任何伺服器
  </p>

</main>

<script>
// ── State ──
let currentStyle = '溫馨';
let apiKey = localStorage.getItem('gemini_key') || '';

// ── Init ──
window.onload = () => {
  if (apiKey) {
    document.getElementById('apiKeyInput').value = apiKey;
    document.getElementById('apiStatus').textContent = '✓ 已設定';
    document.getElementById('apiStatus').className = 'api-status ok';
  }
};

// ── API Key ──
function saveKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem('gemini_key', val);
  document.getElementById('apiStatus').textContent = '✓ 已儲存';
  document.getElementById('apiStatus').className = 'api-status ok';
}

// ── Style ──
function selectStyle(el) {
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentStyle = el.dataset.style;
}

// ── Generate ──
async function generate() {
  if (!apiKey) {
    showError('請先設定 Gemini API Key');
    return;
  }

  const btn = document.getElementById('generateBtn');
  btn.classList.add('loading');
  btn.disabled = true;
  hideError();

  try {
    const text = await callGemini();
    await drawCard(text);
    document.getElementById('previewWrap').classList.add('visible');
    document.getElementById('downloadBtn').classList.add('visible');
  } catch (e) {
    showError('產生失敗：' + e.message + '（請確認 API Key 是否正確）');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// ── Gemini API ──
async function callGemini() {
  const today = new Date();
  const dateStr = today.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' });

  const styleGuide = {
    '溫馨': '溫馨感恩，充滿愛與關懷，像媽媽的擁抱',
    '活力': '活潑元氣，充滿正能量，讓人精神振奮',
    '禪意': '淡雅寧靜，有詩意，像清晨的薄霧',
    '幽默': '輕鬆幽默，帶點可愛的玩笑，讓人會心一笑',
  };

  const prompt = `今天是${dateStr}。
請為一張早安圖產生內容，風格是「${styleGuide[currentStyle]}」。

請回傳 JSON 格式（不要有 markdown 格式，直接回傳 JSON）：
{
  "greeting": "一句早安問候，約10-16個中文字",
  "quote": "一段溫馨的話，約25-40個中文字，可以分兩行",
  "signature": "一個溫馨的結尾，約5-8個中文字，例如「祝您今日平安喜樂」",
  "emoji": "一個最適合的 emoji"
}`;

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.9, maxOutputTokens: 300 },
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const clean = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ── Draw Canvas ──
async function drawCard(content) {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 1080, H = 1080;
  canvas.width = W;
  canvas.height = H;

  const today = new Date();
  const dateStr = today.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  // Backgrounds per style
  const palettes = {
    '溫馨': { bg1: '#FFF5E4', bg2: '#FFE0BC', accent: '#D4845A', text: '#3D1F0A', sub: '#8B5E3C' },
    '活力': { bg1: '#E8F8FF', bg2: '#C8EBF8', accent: '#2980B9', text: '#0D2B3E', sub: '#1A5276' },
    '禪意': { bg1: '#F0F4EE', bg2: '#D8E8D0', accent: '#4A7C59', text: '#1A2E1F', sub: '#4A7C59' },
    '幽默': { bg1: '#FFF9E6', bg2: '#FFE9A0', accent: '#D4A017', text: '#2C1F00', sub: '#7A5900' },
  };
  const p = palettes[currentStyle];

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, p.bg1);
  grad.addColorStop(1, p.bg2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Decorative circles
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = p.accent;
  ctx.beginPath(); ctx.arc(120, 120, 200, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - 80, H - 80, 250, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.06;
  ctx.beginPath(); ctx.arc(W - 100, 150, 180, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  // Border frame
  ctx.strokeStyle = p.accent;
  ctx.lineWidth = 6;
  ctx.globalAlpha = 0.3;
  roundRect(ctx, 40, 40, W - 80, H - 80, 40);
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.15;
  roundRect(ctx, 55, 55, W - 110, H - 110, 35);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Emoji
  ctx.font = '120px serif';
  ctx.textAlign = 'center';
  ctx.fillText(content.emoji || '☀️', W / 2, 260);

  // Greeting
  ctx.fillStyle = p.text;
  ctx.font = `bold 72px 'Noto Serif TC', serif`;
  ctx.textAlign = 'center';
  wrapText(ctx, content.greeting, W / 2, 380, W - 180, 90);

  // Divider
  ctx.strokeStyle = p.accent;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 120, 450); ctx.lineTo(W / 2 + 120, 450);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Quote
  ctx.fillStyle = p.sub;
  ctx.font = `400 46px 'Noto Serif TC', serif`;
  wrapText(ctx, content.quote, W / 2, 560, W - 200, 70);

  // Signature
  ctx.fillStyle = p.accent;
  ctx.font = `500 40px 'Noto Sans TC', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(content.signature, W / 2, 800);

  // Date
  ctx.fillStyle = p.text;
  ctx.globalAlpha = 0.4;
  ctx.font = `300 30px 'Noto Sans TC', sans-serif`;
  ctx.fillText(dateStr, W / 2, 980);
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  if (!text) return y;
  const chars = [...text];
  let line = '';
  let curY = y;
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line !== '') {
      ctx.fillText(line, x, curY);
      curY += lineHeight;
      line = chars[i];
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, curY);
  return curY;
}

// ── Download ──
function download() {
  const canvas = document.getElementById('canvas');
  const today = new Date();
  const name = `早安_${today.getMonth()+1}月${today.getDate()}日.png`;
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

// ── Error ──
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}
function hideError() {
  document.getElementById('errorMsg').classList.remove('visible');
}
</script>
</body>
</html>
